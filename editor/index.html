<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>포트폴리오 내용 편집</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/editor/editor.css">
  <link rel="stylesheet" href="/fonts.css">
  <link rel="stylesheet" href="/rich-document.css">
  <script src="/editor/editor.bundle.js" defer></script>
</head>
<body>
  <header class="toolbar">
    <div><strong>포트폴리오 편집</strong><span id="status" role="status" aria-live="polite">불러오는 중…</span></div>
    <div class="actions"><label for="editor-language">편집 언어</label><select id="editor-language"><option value="en">English</option><option value="ko">한국어</option></select><a id="preview" href="/" target="_blank" rel="noopener">미리보기 ↗</a><button id="save" type="submit" form="content-form" disabled>저장하기</button></div>
  </header>
  <main>
    <div class="introduction"><p class="eyebrow">CONTENT EDITOR</p><h1>내용에만 집중하세요.</h1><p>위에서 편집 언어를 선택하고 아래 내용을 수정하세요.<br>한국어의 빈 칸과 아직 번역하지 않은 항목은 영문 내용을 사용합니다. 이미지와 링크는 영어에서 한 번만 관리해도 됩니다.</p><p class="note">저장하면 선택한 언어의 원본과 로컬 미리보기가 갱신됩니다. 온라인 사이트에는 별도 배포가 필요합니다.</p></div>
    <nav aria-label="편집 항목"><a href="#profile">소개</a><a href="#projects">프로젝트</a><a href="#experience">경력</a><a href="#education">학력</a><a href="#case-studies">상세 페이지</a></nav>
    <p id="error" role="alert" hidden></p>
    <form id="content-form"><div id="fields"></div></form>
    <footer>이 편집기는 내 컴퓨터에서만 열립니다. 저장 전 내용은 <code>.local/backups</code> 폴더에 자동으로 보관됩니다.</footer>
  </main>
</body>
</html>
