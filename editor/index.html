<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>포트폴리오 내용 편집</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/editor/editor.css">
  <script src="/editor/editor.js" defer></script>
</head>
<body>
  <header class="toolbar">
    <div><strong>포트폴리오 편집</strong><span id="status" role="status" aria-live="polite">불러오는 중…</span></div>
    <div class="actions"><a href="/" target="_blank" rel="noopener">미리보기 ↗</a><button id="save" type="submit" form="content-form" disabled>저장하기</button></div>
  </header>
  <main>
    <div class="introduction"><p class="eyebrow">CONTENT EDITOR</p><h1>내용에만 집중하세요.</h1><p>아래 칸을 채우고 저장하면 내 컴퓨터의 사이트에 반영됩니다.<br>영문 사이트이므로 공개할 내용은 영어로 작성해 주세요.</p><p class="note">빈 링크와 제목 없는 항목은 사이트에서 자동으로 숨겨집니다. 온라인 사이트에는 별도 배포가 필요합니다.</p></div>
    <nav aria-label="편집 항목"><a href="#profile">소개</a><a href="#education">학력</a><a href="#projects">프로젝트</a><a href="#experience">경력</a></nav>
    <p id="error" role="alert" hidden></p>
    <form id="content-form"><div id="fields"></div></form>
    <footer>이 편집기는 내 컴퓨터에서만 열립니다. 저장 전 내용은 <code>.local/backups</code> 폴더에 자동으로 보관됩니다.</footer>
  </main>
</body>
</html>
